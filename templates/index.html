<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safeguard Vision Alpha - Monitor Multi-Cámara</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>📹 Safeguard Vision <span style="font-size:0.65rem;opacity:0.5">ALPHA</span></h1>
            <div class="header-controls">
                <div class="status-badge" id="ws-status" style="background: #555;">CONECTANDO...</div>
                <div class="status-badge" id="cam-count">0 CÁMARAS</div>
                <span class="user-badge">👤 {{ current_user.username }}</span>
                <a href="{{ url_for('change_password') }}" class="logout-btn" style="background:#30363d;">Contraseña</a>
                <a href="{{ url_for('logout') }}" class="logout-btn">Cerrar Sesión</a>
            </div>
        </header>

        <main>
            <!-- ============= GRID DE CÁMARAS ============= -->
            <div class="camera-grid-wrapper">
                <div class="camera-grid" id="camera-grid">
                    <!-- Tiles generate dinamic via JS -->
                </div>
            </div>

            <!-- ============= PANEL LATERAL ============= -->
            <aside class="dashboard-panel">
                <!-- Stats agregate -->
                <div class="stat-row">
                    <div class="stat-card flex-1">
                        <h3>Personas</h3>
                        <p class="stat-value" id="person-count">0</p>
                    </div>
                    <div class="stat-card flex-1 danger">
                        <h3>Infracciones</h3>
                        <p class="stat-value" id="violation-count" style="color: var(--danger);">0</p>
                    </div>
                </div>

                <!-- Form añadir cámara -->
                <div class="add-camera-form">
                    <h3>➕ Añadir Cámara</h3>
                    <input type="text" id="cam-name" placeholder="Nombre (ej: Depósito B)">
                    <input type="text" id="cam-url" placeholder="URL RTSP (rtsp://...)">
                    <button class="add-btn" onclick="addCamera()">Añadir</button>
                </div>

                <!-- Alertas -->
                <div class="alerts-section">
                    <h3>🚨 Registro de Alertas</h3>
                    <ul id="alerts-list">
                        <li class="placeholder" style="color: var(--text-secondary); font-size: 0.85rem;">Sin alertas recientes...</li>
                    </ul>
                </div>

                <!-- Export/Stats -->
                <div class="alerts-section" style="margin-top: 15px;">
                    <h3>📊 Exportar</h3>
                    <a href="/api/report?format=csv" class="logout-btn" style="display:block;text-align:center;margin-bottom:8px;">Descargar CSV</a>
                    <a href="/api/report?format=json" class="logout-btn" style="display:block;text-align:center;background:#30363d;">Descargar JSON</a>
                </div>
            </aside>
        </main>
    </div>

    <!-- ============= MODAL FULLSCREEN ============= -->
    <div class="fullscreen-modal" id="fullscreen-modal">
        <button class="fullscreen-close" onclick="closeFullscreen()">✕</button>
        <img id="fullscreen-img" src="" alt="">
        <div class="fullscreen-name" id="fullscreen-name"></div>
    </div>

    <script>
        const wsStatus = document.getElementById('ws-status');
        const cameraGrid = document.getElementById('camera-grid');
        const camCount = document.getElementById('cam-count');

        // Estado local
        let cameras = [];  // lista de info cámaras

        // =========================================================================
        // WebSocket
        // =========================================================================
        const socket = io('/monitor', {
            transports: ['websocket', 'polling']
        });

        socket.on('connect', () => {
            wsStatus.textContent = 'CONECTADO';
            wsStatus.className = 'status-badge';
            wsStatus.style.background = '#238636';
        });

        socket.on('disconnect', () => {
            wsStatus.textContent = 'DESCONECTADO';
            wsStatus.style.background = '#da3633';
        });

        socket.on('connect_error', () => {
            wsStatus.textContent = 'RECONNECTANDO...';
            wsStatus.style.background = '#d29922';
        });

        socket.on('stats_update', (data) => {
            // Actualizar contadores
            document.getElementById('person-count').textContent = data.total_persons || 0;
            document.getElementById('violation-count').textContent = data.violations || 0;

            // Actualizar lista de cámaras
            if (data.cameras) {
                cameras = data.cameras;
                renderCameraGrid();
            }

            // Alertas
            if (data.alerts && data.alerts.length > 0) {
                renderAlerts(data.alerts);
            }

            // Incidentes DB
            if (data.recent_incidents && data.recent_incidents.length > 0) {
                renderIncidents(data.recent_incidents);
            }

            // Feedback visual
            if (data.violations > 0) {
                document.body.classList.add('alert-active');
            } else {
                document.body.classList.remove('alert-active');
            }
        });

        // =========================================================================
        // Renderizar grid de cámaras
        // =========================================================================
        function renderCameraGrid() {
            camCount.textContent = `${cameras.length} CÁMARAS`;

            if (cameras.length === 0) {
                cameraGrid.innerHTML = `
                    <div class="no-cameras">
                        <h2>No hay cámaras configuradas</h2>
                        <p>Añade una cámara usando el formulario de la derecha,<br>
                           o edita <code>cameras.json</code> y reinicia.</p>
                    </div>`;
                cameraGrid.className = 'camera-grid';
                return;
            }

            // Clase para grid de cámara única
            cameraGrid.className = cameras.length === 1
                ? 'camera-grid single-camera'
                : 'camera-grid';

            // Optimización: solo actualizar si cambió el número de cámaras
            const existingTiles = cameraGrid.querySelectorAll('.camera-tile');
            if (existingTiles.length !== cameras.length) {
                // Recrear tiles
                cameraGrid.innerHTML = cameras.map(cam => createTileHTML(cam)).join('');
                // Iniciar streams
                cameras.forEach(cam => startStream(cam));
            } else {
                // Solo actualizar status/info overlays
                cameras.forEach(cam => updateTileInfo(cam));
            }
        }

        function createTileHTML(cam) {
            const statusClass = cam.status || 'offline';
            const statusText = (cam.status || 'offline').toUpperCase();
            return `
                <div class="camera-tile" id="tile-${cam.id}"
                     onclick="openFullscreen(${cam.id})">
                    <img id="stream-${cam.id}" src="" alt="${cam.name}">
                    <div class="tile-overlay">
                        <div class="tile-top">
                            <span class="tile-name">${cam.name}</span>
                            <span class="tile-status ${statusClass}" id="status-${cam.id}">${statusText}</span>
                        </div>
                        <div class="tile-bottom">
                            <div class="tile-stats" id="stats-${cam.id}">
                                <span class="tile-persons">👤 0</span>
                                <span class="tile-violations">⚠️ 0</span>
                            </div>
                            <div class="tile-controls" onclick="event.stopPropagation()">
                                <button class="tile-btn" onclick="toggleCamera(${cam.id})"
                                        title="Activar/Desactivar">
                                    ${cam.enabled ? '⏸️' : '▶️'}
                                </button>
                                <button class="tile-btn danger" onclick="removeCamera(${cam.id})"
                                        title="Eliminar">🗑️</button>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function startStream(cam) {
            const img = document.getElementById(`stream-${cam.id}`);
            if (img && cam.enabled && cam.status !== 'disabled') {
                img.src = `/video_feed/${cam.id}`;
            }
        }

        function updateTileInfo(cam) {
            const statusEl = document.getElementById(`status-${cam.id}`);
            if (statusEl) {
                const sc = cam.status || 'offline';
                statusEl.className = `tile-status ${sc}`;
                statusEl.textContent = sc.toUpperCase();
            }
            // Actualiza stats per-cameră (persons + violations)
            const statsEl = document.getElementById(`stats-${cam.id}`);
            if (statsEl && cam.stats) {
                const p = cam.stats.total_persons || 0;
                const v = cam.stats.violations || 0;
                statsEl.innerHTML = `<span class="tile-persons">👤 ${p}</span><span class="tile-violations">⚠️ ${v}</span>`;
            }
        }

        // =========================================================================
        // Funciones de cámara
        // =========================================================================
        function addCamera() {
            const name = document.getElementById('cam-name').value.trim();
            const url = document.getElementById('cam-url').value.trim();
            if (!url) { alert('URL necesaria'); return; }

            fetch('/api/camera/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name || 'Cámara', url: url })
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'ok') {
                    document.getElementById('cam-name').value = '';
                    document.getElementById('cam-url').value = '';
                    // El WebSocket actualizará el grid
                } else {
                    alert('Error: ' + (data.error || 'desconocido'));
                }
            })
            .catch(err => alert('Error: ' + err));
        }

        function toggleCamera(camId) {
            fetch(`/api/camera/${camId}/toggle`, { method: 'POST' })
                .then(r => r.json())
                .then(() => {
                    // WebSocket actualizará
                    setTimeout(() => location.reload(), 500);
                });
        }

        function removeCamera(camId) {
            if (!confirm('¿Eliminar esta cámara?')) return;
            fetch(`/api/camera/${camId}/remove`, { method: 'POST' })
                .then(() => setTimeout(() => location.reload(), 500));
        }

        // =========================================================================
        // Fullscreen modal
        // =========================================================================
        function openFullscreen(camId) {
            const cam = cameras.find(c => c.id === camId);
            if (!cam) return;
            const modal = document.getElementById('fullscreen-modal');
            const img = document.getElementById('fullscreen-img');
            const nameEl = document.getElementById('fullscreen-name');
            img.src = `/video_feed/${camId}`;
            nameEl.textContent = `${cam.name} (ID: ${camId})`;
            modal.classList.add('active');
        }

        function closeFullscreen() {
            const modal = document.getElementById('fullscreen-modal');
            const img = document.getElementById('fullscreen-img');
            img.src = '';
            modal.classList.remove('active');
        }

        // ESC para cerrar fullscreen
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeFullscreen();
        });

        // =========================================================================
        // Renderizar alertas / incidentes
        // =========================================================================
        function renderAlerts(alerts) {
            // Las alertas se muestran desde incidents de la DB
        }

        function renderIncidents(incidents) {
            const alertsList = document.getElementById('alerts-list');
            alertsList.innerHTML = '';
            incidents.forEach(inc => {
                const li = document.createElement('li');
                li.className = 'alert-item';
                const timeStr = new Date(inc.timestamp).toLocaleTimeString();
                const camTag = inc.camera_id ? ` [Cam ${inc.camera_id}]` : '';
                let html = `<span>⚠️ ${inc.type}${camTag} - ${timeStr} `;
                if (inc.image_path) {
                    html += `<a href="/static/${inc.image_path}" target="_blank" style="text-decoration:none;font-size:1.2rem">📷</a>`;
                }
                html += `</span>`;
                li.innerHTML = html;
                alertsList.appendChild(li);
            });
        }
    </script>
</body>
</html>
