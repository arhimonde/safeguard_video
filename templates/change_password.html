<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - Safeguard Vision</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            color: #f0f6fc;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #161b22;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #30363d;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 1.5rem;
        }

        .subtitle {
            color: #8b949e;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #2ea043;
        }

        .error { color: #da3633; margin-top: 10px; font-size: 0.9rem; }
        .success { color: #238636; margin-top: 10px; font-size: 0.9rem; }
    </style>
</head>

<body>
    <div class="card">
        <h1>Cambiar Contraseña</h1>
        <p class="subtitle">Debes cambiar la contraseña por defecto antes de continuar.</p>
        <form method="POST">
            <input type="password" name="current_password" placeholder="Contraseña actual" required autofocus>
            <input type="password" name="new_password" placeholder="Nueva contraseña (mín. 8 caracteres)" required>
            <input type="password" name="confirm_password" placeholder="Confirmar nueva contraseña" required>
            <button type="submit">Cambiar Contraseña</button>
        </form>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        {% if success %}<p class="success">{{ success }}</p>{% endif %}
    </div>
</body>

</html>
